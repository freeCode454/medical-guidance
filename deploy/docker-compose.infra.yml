# 开发期基础设施编排
#
# ── 定位 ────────────────────────────────────────────────────────────────
# **只起基础设施，应用在宿主机运行**（02 文档 §9.2）。
#
# ── 镜像前缀 MIRROR_PREFIX ─────────────────────────────────────────────
# 国内直连 Docker Hub 不可用、公共镜像源已停服，所有 image 统一加前缀，
# 指向个人镜像加速服务（轩辕镜像专业版）。
# 前缀配置在 deploy/.env 的 MIRROR_PREFIX（形如 xxx.xuanyuan.run/）。
# 交付形态：MIRROR_PREFIX 留空（走官方源），或改为离线导入（NFR55）。
#
# ── 渐进式启动（本机可用内存约 4.4 GB）────────────────────────────────
#   make db-up          PostgreSQL（自动执行 init.sql 建 23 表）
#   make vector-up      Milvus Standalone（单容器，内嵌 etcd + 本地存储）
#   make cache-up       Redis（可选）
#   make storage-up     MinIO（可选，见下方说明）
#
# ── 向量库说明 ──────────────────────────────────────────────────────────
# Milvus Lite 官方不支持 Windows；Milvus Standalone 用「内嵌 etcd + 本地存储」
# （ETCD_USE_EMBED=true + COMMON_STORAGE_TYPE=local）单容器运行，无需独立
# etcd 与 minio 容器。开发形态最简部署；交付形态按官方三容器方案。
#
# ── MinIO 说明 ──────────────────────────────────────────────────────────
# MinIO 仅用于应用文件存储（mg_file 表对应对象）。当前镜像源拉不到 minio
# 镜像，故开发期**先不启用**，文件落本地目录（表结构与接口不变，见 03 §3.6.3）。
# 镜像可拉后执行 make storage-up 即可切换。

name: medical-guidance-infra

services:
  # ── 关系数据库 ────────────────────────────────────────────────────────
  # 首次启动自动执行 init.sql（建 23 表 / 67 索引 / 2 触发器 + 种子数据）。
  # 注意：docker-entrypoint-initdb.d 只在数据目录为空时执行一次。
  postgres:
    # 使用内置 pgvector 扩展的镜像（init.sql 需要 CREATE EXTENSION vector）
    image: ${MIRROR_PREFIX}pgvector/pgvector:pg16
    container_name: mg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medguide}
      POSTGRES_DB: ${POSTGRES_DB:-medguide}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      # 用 named volume 而非 bind mount：Windows 上 bind mount 的 9p/virtiofs
      # 写语义会导致 WAL 尾部出现 0 字节填充（invalid record length），
      # PG 反复进入崩溃恢复。named volume 落在 WSL 的 ext4 上，稳定。
      - mg_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medguide} -d ${POSTGRES_DB:-medguide}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - log_min_duration_statement=500

  # ── 向量库：Milvus Standalone（内嵌 etcd + 本地存储）─────────────────
  # 单容器运行，无需 etcd / minio 依赖容器。开发机内存有限故 mem_limit 2g。
  milvus:
    image: ${MIRROR_PREFIX}milvusdb/milvus:v2.5.9
    container_name: mg-milvus
    profiles: ["vector"]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGE_TYPE: local
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - ../data/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    mem_limit: 2g

  # ── 缓存 / 限流 / 消息广播 ────────────────────────────────────────────
  # db 划分见 03 文档 §6.7：db 0 业务缓存 / db 1 Celery broker / db 2 backend。
  redis:
    image: ${MIRROR_PREFIX}redis:7-alpine
    container_name: mg-redis
    profiles: ["cache"]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru

  # ── 对象存储（S3 兼容）────────────────────────────────────────────────
  # 仅应用文件存储用。当前镜像源拉不到 minio，开发期暂不启用（见文件头说明）。
  # 启用方式：make storage-up
  minio:
    image: ${MIRROR_PREFIX}minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mg-minio
    profiles: ["storage"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9001}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ../data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: server /data --console-address ":9001"

  # ── 对象存储初始化：创建应用桶 ────────────────────────────────────────
  minio-init:
    image: ${MIRROR_PREFIX}minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: mg-minio-init
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-medguide} &&
      echo '对象存储桶已就绪：${MINIO_BUCKET:-medguide}'
      "
    restart: "no"

# ── 数据卷 ──────────────────────────────────────────────────────────────
# PostgreSQL 数据放在 named volume 而非 bind mount：Windows 上 bind mount 的
# 9p/virtiofs 写语义会让 WAL 尾部出现 0 字节填充（invalid record length），
# 导致 PG 反复进入崩溃恢复。named volume 落在 WSL 的 ext4 上，稳定。
volumes:
  mg_pgdata:
    name: mg_pgdata

